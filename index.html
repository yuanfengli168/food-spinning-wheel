<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍕 Food Spinning Wheel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 32px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      align-items: center;
      justify-content: center;
    }

    /* Wheel container */
    .wheel-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .canvas-container {
      position: relative;
    }

    canvas {
      display: block;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(255,255,255,0.08);
    }

    /* Pointer arrow */
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 28px solid #fff;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      z-index: 10;
    }

    /* Spin button */
    #spinBtn {
      padding: 14px 48px;
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: #fff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
      letter-spacing: 0.5px;
    }

    #spinBtn:hover:not(:disabled) {
      transform: scale(1.04);
    }

    #spinBtn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Result display */
    #result {
      font-size: 1.5rem;
      font-weight: 700;
      min-height: 2rem;
      text-align: center;
      color: #f7931e;
      transition: opacity 0.3s;
    }

    /* Checklist */
    .checklist {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      min-width: 200px;
    }

    .checklist h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .checklist label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      cursor: pointer;
      font-size: 0.95rem;
      user-select: none;
      transition: color 0.15s;
    }

    .checklist label:hover { color: #f7931e; }

    .checklist input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #f7931e;
      cursor: pointer;
    }

    .checklist .warning {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #e05555;
      display: none;
    }

    .checklist .warning.visible { display: block; }
  </style>
</head>
<body>

<h1>🍽️ Food Spinning Wheel</h1>

<div class="layout">

  <!-- Wheel -->
  <div class="wheel-wrap">
    <div class="canvas-container">
      <div class="pointer"></div>
      <canvas id="wheel" width="380" height="380"></canvas>
    </div>
    <div id="result"></div>
    <button id="spinBtn">SPIN</button>
  </div>

  <!-- Checklist -->
  <div class="checklist">
    <h2>What's on the menu?</h2>
    <div id="foodList"></div>
    <div class="warning" id="warning">⚠️ Pick at least 2 foods</div>
  </div>

</div>

<script>
  // ─── Data ────────────────────────────────────────────────────────────────────
  const FOODS = [
    { name: '🍕 Pizza',       color: '#e63946' },
    { name: '🍣 Sushi',       color: '#457b9d' },
    { name: '🍔 Burger',      color: '#e9c46a' },
    { name: '🌮 Tacos',       color: '#2a9d8f' },
    { name: '🍜 Ramen',       color: '#f4a261' },
    { name: '🍛 Curry',       color: '#e76f51' },
    { name: '🥗 Salad',       color: '#52b788' },
    { name: '🍝 Pasta',       color: '#ffb703' },
    { name: '🥪 Sandwich',    color: '#8ecae6' },
    { name: '🍱 Bento',       color: '#a8dadc' },
    { name: '🫔 Burrito',     color: '#c77dff' },
    { name: '🥩 Steak',       color: '#d62828' },
  ];

  // Pre-checked: Pizza + Sushi
  const DEFAULT_CHECKED = new Set([0, 1]);

  // ─── State ───────────────────────────────────────────────────────────────────
  let checked = new Set(DEFAULT_CHECKED);
  let currentAngle = 0;   // radians, cumulative
  let spinning = false;

  // ─── DOM refs ────────────────────────────────────────────────────────────────
  const canvas  = document.getElementById('wheel');
  const ctx     = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const result  = document.getElementById('result');
  const warning = document.getElementById('warning');
  const foodList = document.getElementById('foodList');

  // ─── Build checklist ─────────────────────────────────────────────────────────
  FOODS.forEach((food, i) => {
    const label = document.createElement('label');
    const cb    = document.createElement('input');
    cb.type     = 'checkbox';
    cb.checked  = DEFAULT_CHECKED.has(i);
    cb.dataset.index = i;
    cb.addEventListener('change', () => {
      if (cb.checked) checked.add(i);
      else            checked.delete(i);
      validateAndDraw();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(food.name));
    foodList.appendChild(label);
  });

  // ─── Validation ──────────────────────────────────────────────────────────────
  function validateAndDraw() {
    const ok = checked.size >= 2;
    warning.classList.toggle('visible', !ok);
    spinBtn.disabled = !ok || spinning;
    drawWheel(currentAngle);
    return ok;
  }

  // ─── Draw wheel ──────────────────────────────────────────────────────────────
  function drawWheel(angle) {
    const W = canvas.width;
    const cx = W / 2, cy = W / 2, r = W / 2 - 4;

    ctx.clearRect(0, 0, W, W);

    const items = [...checked].map(i => FOODS[i]);
    if (items.length === 0) return;

    const arc = (2 * Math.PI) / items.length;

    items.forEach((food, idx) => {
      const start = angle + idx * arc - Math.PI / 2;
      const end   = start + arc;

      // Slice
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = food.color;
      ctx.fill();

      // Divider
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Label
      const mid = start + arc / 2;
      const labelR = r * 0.65;
      const tx = cx + labelR * Math.cos(mid);
      const ty = cy + labelR * Math.sin(mid);

      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(mid + Math.PI / 2);

      const fontSize = Math.max(10, Math.min(16, 260 / items.length));
      ctx.font = `bold ${fontSize}px -apple-system, sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 4;

      // Strip emoji for text on small slices, keep emoji for larger
      const label = items.length > 8 ? food.name.slice(food.name.indexOf(' ') + 1) : food.name;
      ctx.fillText(label, 0, 0);

      ctx.restore();
    });

    // Center cap
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
    ctx.fillStyle = '#1a1a1a';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // ─── Ease-out cubic ──────────────────────────────────────────────────────────
  function easeOut(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  // ─── Spin logic ──────────────────────────────────────────────────────────────
  spinBtn.addEventListener('click', () => {
    if (spinning || checked.size < 2) return;

    result.textContent = '';
    spinning = true;
    spinBtn.disabled = true;

    const duration  = 2000 + Math.random() * 2000; // 2–4 s
    const extraRots = (5 + Math.random() * 5) * 2 * Math.PI;  // 5–10 full turns
    const extraAngle = Math.random() * 2 * Math.PI;            // random landing
    const totalDelta = extraRots + extraAngle;

    const startAngle = currentAngle;
    const startTime  = performance.now();

    function frame(now) {
      const elapsed = now - startTime;
      const t       = Math.min(elapsed / duration, 1);
      currentAngle  = startAngle + totalDelta * easeOut(t);
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        // Determine winner
        const items  = [...checked].map(i => FOODS[i]);
        const arc    = (2 * Math.PI) / items.length;
        // Pointer is at top (−π/2). Normalize angle to [0, 2π)
        const norm   = ((-(currentAngle - Math.PI / 2)) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const winner = items[Math.floor(norm / arc) % items.length];

        result.textContent = `🎉 ${winner.name}!`;
        spinning = false;
        spinBtn.disabled = false;
      }
    }

    requestAnimationFrame(frame);
  });

  // ─── Init ────────────────────────────────────────────────────────────────────
  validateAndDraw();
</script>

</body>
</html>
